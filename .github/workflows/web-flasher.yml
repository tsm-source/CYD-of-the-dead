name: Build and deploy web flasher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: pio run -e esp32dev-fast

      - name: Assemble website and firmware
        env:
          VERSION: ${{ github.sha }}
        run: |
          mkdir -p site/firmware
          cp web-flasher/index.html site/index.html
          cp web-flasher/manifest.json site/manifest.json
          cp .pio/build/esp32dev-fast/bootloader.bin site/firmware/bootloader.bin
          cp .pio/build/esp32dev-fast/partitions.bin site/firmware/partitions.bin
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" site/firmware/boot_app0.bin
          cp .pio/build/esp32dev-fast/firmware.bin site/firmware/firmware.bin
          python -c "import json, os; path='site/manifest.json'; data=json.load(open(path)); data['version']=os.environ['VERSION'][:7]; json.dump(data, open(path, 'w'), indent=2); print()"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
